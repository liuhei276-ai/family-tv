<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小小读书郎 · 识字与绘本</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fffaf0;color:#3b2f1e;font-family:"Microsoft YaHei","PingFang SC",sans-serif;
     min-height:100vh;overflow:hidden}
#app{max-width:1400px;margin:0 auto;padding:36px 48px;height:100vh;display:flex;flex-direction:column}
.view{display:none;flex:1;flex-direction:column;min-height:0}
.view.on{display:flex}
h1{font-size:46px;color:#e65100;margin-bottom:8px;letter-spacing:2px}
.sub{font-size:26px;color:#8a6a3a;margin-bottom:26px}
.grid{display:grid;gap:22px;overflow-y:auto;padding:6px}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.card,.tile,.ctrl{background:#fff;border:5px solid #ffcc66;border-radius:24px;
  font-family:inherit;cursor:pointer;color:#5a3d12;transition:transform .12s,box-shadow .12s;
  box-shadow:0 7px 0 #ffe0a0}
.card{font-size:44px;font-weight:900;padding:60px 20px;min-height:230px;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:16px}
.card small{font-size:24px;font-weight:500;color:#a07838}
.tile{font-size:34px;font-weight:800;padding:30px 10px;min-height:130px}
.tile small{display:block;font-size:20px;color:#a07838;margin-top:8px;font-weight:500}
.zi{font-size:72px;font-weight:900;padding:14px 4px;min-height:130px;line-height:1}
.zi small{display:block;font-size:22px;color:#b08340;font-weight:600}
.card.active,.tile.active,.zi.active,.ctrl.active{outline:9px solid #e65100;outline-offset:5px;
  transform:translateY(-4px);box-shadow:0 11px 0 #ffcc66;background:#fff6e0}
.bar{display:flex;gap:18px;margin-top:22px;flex-wrap:wrap}
.ctrl{font-size:28px;font-weight:800;padding:18px 40px;border-radius:16px}
.bigchar{font-size:210px;font-weight:900;color:#d84315;line-height:1.1;text-align:center}
.py{font-size:52px;color:#6a4b20;text-align:center;margin:6px 0 18px;letter-spacing:3px}
.words{font-size:38px;text-align:center;margin-bottom:16px;color:#5d4037}
.sent{background:#fff;border:5px solid #ffcc66;border-radius:22px;padding:26px 34px;
  font-size:36px;line-height:1.6;text-align:center}
.detail{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.story-card{text-align:left;font-size:38px;font-weight:800;padding:30px 34px;min-height:150px}
.story-card small{display:block;font-size:22px;color:#a07838;margin-top:10px;font-weight:500}
.page{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.page svg{width:min(46vh,420px);height:min(46vh,420px)}
.page .txt{background:#fff;border:5px solid #ffcc66;border-radius:24px;padding:26px 40px;
  font-size:42px;line-height:1.7;max-width:1050px;text-align:center}
.pageno{font-size:24px;color:#a07838}
.hint{font-size:22px;color:#b09060;margin-top:14px;text-align:center}
</style>
</head>

/* ============ 页面状态 ============ */
let st={view:'home',g:0,ci:0,si:0,pi:0},hist=[];
const app=document.getElementById('app');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  let h='',sub='';
  if(st.view==='home'){
    sub='用遥控器方向键选择，按“确定”进入';
    h='<div class="grid g2">'+
      '<button class="card focusable" data-a="chars">📖 识字乐园<small>80 个常用字，带拼音和组词</small></button>'+
      '<button class="card focusable" data-a="stories">🎈 绘本故事<small>6 个小故事，一页一页翻</small></button>'+
      '</div><div class="hint">按遥控器“返回键”回到上一页</div>';
  }else if(st.view==='groups'){
    sub='识字乐园 · 选一组';
    h='<div class="grid g4">'+CHARS.map((g,i)=>
      '<button class="tile focusable" data-g="'+i+'">'+g.icon+' '+g.name+'<small>'+g.list.length+' 个字</small></button>').join('')+'</div>';
  }else if(st.view==='chars'){
    const g=CHARS[st.g];sub=g.icon+' '+g.name+' · 选一个字';
    h='<div class="grid g6">'+g.list.map((x,i)=>
      '<button class="zi focusable" data-ci="'+i+'">'+x[0]+'<small>'+x[1]+'</small></button>').join('')+'</div>';
  }else if(st.view==='zi'){
    const x=CHARS[st.g].list[st.ci];sub=CHARS[st.g].name+' · 第 '+(st.ci+1)+' / '+CHARS[st.g].list.length+' 字';
    h='<div class="detail"><div class="bigchar">'+x[0]+'</div><div class="py">'+x[1]+'</div>'+
      '<div class="words">'+esc(x[2])+'</div><div class="sent">'+esc(x[3])+'</div></div>';
  }else if(st.view==='stories'){
    sub='绘本故事 · 选一个';
    h='<div class="grid g2">'+STORIES.map((s,i)=>
      '<button class="story-card focusable" data-s="'+i+'">'+s.emoji+' '+s.title+'<small>'+s.pages.length+' 页 · 方向键翻页</small></button>').join('')+'</div>';
  }else if(st.view==='page'){
    const s=STORIES[st.si],p=s.pages[st.pi];sub=s.title+' · 第 '+(st.pi+1)+' / '+s.pages.length+' 页';
    h='<div class="page">'+scene(p.s)+'<div class="txt">'+esc(p.t)+'</div>'+
      '<div class="pageno">'+(st.pi+1)+' / '+s.pages.length+'</div></div>';
  }
  app.innerHTML='<h1>小小读书郎</h1><div class="sub">'+sub+'</div><div class="view on">'+h+'</div>';
  const acts={};
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>go(b.dataset.a));
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{push();st.g=+b.dataset.g;st.ci=0;st.view='chars';render()});
  app.querySelectorAll('[data-ci]').forEach(b=>b.onclick=()=>{push();st.ci=+b.dataset.ci;st.view='zi';render()});
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{push();st.si=+b.dataset.s;st.pi=0;st.view='page';render()});
  setFocus(0);
}
function push(){hist.push({...st})}
function go(v){push();st.view=v;render()}
function back(){
  if(!hist.length)return;
  st=hist.pop();render();return true;
}
function setFocus(i){
  const els=[...app.querySelectorAll('.focusable')];
  els.forEach(e=>e.classList.remove('active'));
  if(els[i])els[i].classList.add('active');
}
function move(dir){
  const els=[...app.querySelectorAll('.focusable')];
  if(!els.length)return;
  let cur=els.findIndex(e=>e.classList.contains('active'));
  if(cur<0)cur=0;
  if(dir==='left'){setFocus(Math.max(0,cur-1));return}
  if(dir==='right'){setFocus(Math.min(els.length-1,cur+1));return}
  const r=els[cur].getBoundingClientRect(),cy=r.top+r.height/2,cx=r.left+r.width/2;
  let best=-1,bd=1e9;
  els.forEach((el,i)=>{
    if(i===cur)return;
    const q=el.getBoundingClientRect(),qy=q.top+q.height/2,qx=q.left+q.width/2,dy=qy-cy;
    if(dir==='down'&&dy<10)return;
    if(dir==='up'&&dy>-10)return;
    const d=Math.abs(dy)*2+Math.abs(qx-cx);
    if(d<bd){bd=d;best=i}
  });
  if(best>=0)setFocus(best);
}
function next(){
  if(st.view==='zi'){
    const l=CHARS[st.g].list;
    if(st.ci<l.length-1){st.ci++;render()}
  }else if(st.view==='page'){
    const p=STORIES[st.si].pages;
    if(st.pi<p.length-1){st.pi++;render()}
  }
}
function prev(){
  if(st.view==='zi'&&st.ci>0){st.ci--;render()}
  else if(st.view==='page'&&st.pi>0){st.pi--;render()}
}
document.addEventListener('keydown',function(e){
  const k=e.key;
  if(k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'){
    if(st.view==='zi'){if(k==='ArrowLeft')prev();else if(k==='ArrowRight')next()}
    else if(st.view==='page'){if(k==='ArrowLeft')prev();else if(k==='ArrowRight')next()}
    else move(k==='ArrowLeft'?'left':k==='ArrowRight'?'right':k==='ArrowUp'?'up':'down');
    e.preventDefault();return;
  }
  if(k==='Enter'||k===' '){
    const a=app.querySelector('.focusable.active');
    if(a)a.click();
    else if(st.view==='zi'||st.view==='page')next();
    e.preventDefault();return;
  }
  if(k==='Escape'||k==='Backspace'){
    if(!back()){st={view:'home',g:0,ci:0,si:0,pi:0};hist=[];render()}
    e.preventDefault();return;
  }
});
render();
</script>
</body>
</html>
